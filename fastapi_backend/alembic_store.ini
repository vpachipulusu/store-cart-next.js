# Used only to author store revisions:
#   uv run alembic -c alembic_store.ini revision -m "add widgets" --rev-id 0002
# Applying them is the job of app.services.store_migrations / commands.migrate_stores.
[alembic]
script_location = alembic_store
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
