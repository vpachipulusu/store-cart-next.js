[project]
name = "storecart-backend"
version = "0.1.0"
description = "StoreCart FastAPI backend (adapted from vintasoftware/nextjs-fastapi-template, see TEMPLATE_LICENSE.txt)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.0,<0.144",
    "asyncpg>=0.32.0,<0.33",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "pydantic-settings>=2.15.0,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0,<5",
    "ruff>=0.17.0,<0.18",
    "watchdog>=6.0.0,<7",
    "python-dotenv>=1.2.4,<2",
    "pytest>=9.1.1,<10",
    "pytest-mock>=3.16.0,<4",
    "mypy>=2.4.0,<3",
    "coveralls>=4.0.1,<5",
    "alembic>=1.20.0,<2",
    "pytest-asyncio>=1.4.0,<2",
    "mkdocs-material>=9.6.9",
    "mkdocs-material[imaging]>=9.6.9",
    "pytest-cov>=7.1.0,<8",
]

[tool.uv]
package = false

# Coverage ratchet (KAN-27, PO decision on KAN-139). `uv run pytest --cov` fails
# when line coverage of app/ and commands/ is below fail_under. fail_under is the
# measured baseline (84.13% on 2026-10-12, CI): raise it as tests are added,
# never lower it.
[tool.coverage.run]
source = ["app", "commands"]

[tool.coverage.report]
fail_under = 84.13
precision = 2

[tool.hatch.build.targets.sdist]
include = ["commands"]

[tool.hatch.build.targets.wheel]
include = ["commands"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
