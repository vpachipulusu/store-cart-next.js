[project]
name = "storecart-backend"
version = "0.1.0"
description = "StoreCart FastAPI backend (adapted from vintasoftware/nextjs-fastapi-template, see TEMPLATE_LICENSE.txt)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0,<0.116",
    "asyncpg>=0.29.0,<0.30",
    "sqlalchemy>=2.0.36,<3",
    "pydantic-settings>=2.5.2,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=3.4.0,<4",
    "ruff>=0.1.0,<0.2",
    "watchdog>=5.0.3,<6",
    "python-dotenv>=1.0.1,<2",
    "pytest>=8.3.3,<9",
    "pytest-mock>=3.14.0,<4",
    "mypy>=1.13.0,<2",
    "coveralls>=4.0.1,<5",
    "alembic>=1.14.0,<2",
    "pytest-asyncio>=0.24.0,<0.25",
    "mkdocs-material>=9.6.9",
    "mkdocs-material[imaging]>=9.6.9",
    "pytest-cov>=5,<7",
]

[tool.uv]
package = false

# Coverage ratchet (KAN-27, PO decision on KAN-139). `uv run pytest --cov` fails
# when line coverage of app/ and commands/ is below fail_under. fail_under is the
# measured baseline (84.13% on 2026-10-12, CI): raise it as tests are added,
# never lower it.
[tool.coverage.run]
source = ["app", "commands"]

[tool.coverage.report]
fail_under = 84.13
precision = 2

[tool.hatch.build.targets.sdist]
include = ["commands"]

[tool.hatch.build.targets.wheel]
include = ["commands"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
