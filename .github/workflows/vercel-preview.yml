# Manual preview deploy via the Vercel CLI (KAN-188). workflow_dispatch only: it never runs on
# PRs or pushes and is outside the CI gate. Normal deploys still come from Vercel's Git integration.
name: Vercel preview (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
