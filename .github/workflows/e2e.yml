# Chromium end-to-end tests for nextjs-frontend/ (KAN-27).
#
# Opt-in until KAN-113 (e2e baseline) is merged. ci.yml calls this workflow only
# when the frontend changed AND the repository variable E2E_ENABLED is "true",
# and it is NOT part of the "CI gate" job yet.
#
# Secrets come from the GitHub environment `e2e-test`, which must hold TEST
# credentials only (a Firebase test project and Stripe test-mode keys), never
# production values. Secrets are referenced by name only.
name: E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  chromium:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-test
    defaults:
      run:
        working-directory: nextjs-frontend
    services:
      # Throwaway database for the Prisma-backed pages; exists only for this job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storecart_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storecart_e2e?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: StoreCart
      # Firebase TEST project (environment e2e-test).
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.E2E_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.E2E_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.E2E_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.E2E_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.E2E_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.E2E_FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.E2E_FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.E2E_FIREBASE_ADMIN_PRIVATE_KEY }}
      # Stripe TEST mode keys (environment e2e-test).
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Refuse live Stripe keys
        run: |
          case "${STRIPE_SECRET_KEY}" in
            sk_live_*|rk_live_*) echo "::error::e2e-test holds a live Stripe key. Use test-mode keys only."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare database
        run: |
          npm run db:generate
          npx prisma db push --skip-generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # After KAN-113 this creates random e2e accounts in the Firebase test project.
      - name: Create test accounts
        run: npm run test:setup

      - name: Run Chromium e2e
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            nextjs-frontend/playwright-report/
            nextjs-frontend/test-results/
          retention-days: 7
