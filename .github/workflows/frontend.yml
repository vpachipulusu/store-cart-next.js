# Frontend checks for nextjs-frontend/ (KAN-27).
# Called by ci.yml only when nextjs-frontend/** or shared root config changed.
name: Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nextjs-frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextjs-frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('nextjs-frontend/package-lock.json') }}-${{ hashFiles('nextjs-frontend/src/**', 'nextjs-frontend/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('nextjs-frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs unit and integration tests. The thresholds in vitest.config.ts are the
      # coverage ratchet: this step fails if coverage drops below them.
      - name: Unit and integration tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### Frontend coverage'
              echo
              echo '| Metric | Covered |'
              echo '|---|---|'
              jq -r '.total | to_entries[] | select(.key != "branchesTrue") | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Production build with public placeholders only: no DATABASE_URL and no
      # server secrets (KAN-140 made this work). These values are not secrets.
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci-placeholder'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: StoreCart
        run: npm run build
